name: CI

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test release helpers without external services
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\Test-ReleasePipeline.ps1

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore locked, audit, test, compile Bicep, and package
        id: package
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\Publish-Release.ps1 `
            -Version "0.0.0-ci.$env:GITHUB_RUN_ID.$env:GITHUB_RUN_ATTEMPT" `
            -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'artifacts') `
            -GitHubOutput $env:GITHUB_OUTPUT

      - name: Upload untrusted preview package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64-preview
          path: ${{ steps.package.outputs.asset-directory }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
